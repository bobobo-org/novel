<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07101f">
  <title>諸天萬界小說系統｜離線</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07101f;color:#eaf1ff}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#19375a 0,transparent 40%),#07101f}
    main{max-width:650px;margin:24px;padding:28px;border:1px solid #35506f;border-radius:16px;background:#0a1728}
    h1{color:#ffe1a0}p,li{line-height:1.7;color:#bbcae0}button{padding:10px 14px;border:1px solid #4d749d;border-radius:8px;color:#edf5ff;background:#173252;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>目前沒有網際網路</h1>
    <p>作品資料仍保存在這台裝置。已造訪並完成快取的創作頁面可以離線重開；Local Bridge、Ollama 與自架 Private Hub 仍可透過本機 loopback 運作。</p>
    <ul>
      <li>未曾載入的頁面需要恢復網路後才能取得。</li>
      <li>外部 API 與雲端同步在離線時不會執行。</li>
      <li>本機配對授權只存在頁面記憶，重新開頁後需重新配對。</li>
    </ul>
    <button type="button" onclick="location.reload()">重新嘗試</button>
  </main>
</body>
</html>
