name: P2.4B Character Agent Candidate

on:
  pull_request:
    branches:
      - release/p24a-rc2-approved-product
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p24b-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  P24B_BASELINE_COMMIT: d74b97d026589f202cc6645a07770c30b586ebb9
  P24B_PRODUCT_COMMIT: e8250678bbc0513dde4a487f7a10145e42c95d46
  P24B_EVIDENCE_COMMIT: b159f2468a7413f0a8eeb0ebe970024a7bc586da

jobs:
  verify:
    name: Windows LF, regression, browser, and evidence gate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Configure canonical LF before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify commit chain and commit scopes
        shell: pwsh
        run: |
          $expectedHead = '${{ github.event.pull_request.head.sha }}'
          $actualHead = git rev-parse HEAD
          if ($expectedHead -and $actualHead -ne $expectedHead) {
            throw "EXACT_CHECKOUT_MISMATCH:$actualHead/$expectedHead"
          }
          if ((git rev-parse "$env:P24B_PRODUCT_COMMIT^") -ne $env:P24B_BASELINE_COMMIT) {
            throw "PRODUCT_PARENT_MISMATCH"
          }
          if ((git rev-parse "$env:P24B_EVIDENCE_COMMIT^") -ne $env:P24B_PRODUCT_COMMIT) {
            throw "EVIDENCE_PARENT_MISMATCH"
          }
          if ((git rev-parse "HEAD^") -ne $env:P24B_EVIDENCE_COMMIT) {
            throw "CI_PARENT_MISMATCH"
          }
          if ((git rev-parse origin/release/p24a-rc2-approved-product) -ne $env:P24B_BASELINE_COMMIT) {
            throw "REMOTE_BASELINE_MISMATCH"
          }
          $productFiles = @(git diff --name-only $env:P24B_BASELINE_COMMIT $env:P24B_PRODUCT_COMMIT)
          $invalidProduct = @($productFiles | Where-Object {
            $_ -notmatch '^(\.gitattributes|app/|lib/|package\.json$|scripts/run-p24a-drama-os\.mjs$|scripts/run-p24a-rc2-capability-truth\.mjs$|scripts/run-p24b-|scripts/seal-p24b-evidence\.mjs$|scripts/verify-p24b-evidence\.mjs$)'
          })
          if ($invalidProduct.Count) {
            throw "PRODUCT_SCOPE_VIOLATION:$($invalidProduct -join ',')"
          }
          $evidenceFiles = @(git diff --name-only $env:P24B_PRODUCT_COMMIT $env:P24B_EVIDENCE_COMMIT)
          $invalidEvidence = @($evidenceFiles | Where-Object {
            $_ -notlike 'artifacts/p24b-character-agent/*'
          })
          if ($invalidEvidence.Count) {
            throw "EVIDENCE_SCOPE_VIOLATION:$($invalidEvidence -join ',')"
          }
          $ciFiles = @(git diff --name-only $env:P24B_EVIDENCE_COMMIT HEAD)
          if ($ciFiles.Count -ne 1 -or $ciFiles[0] -ne '.github/workflows/p24b-candidate.yml') {
            throw "CI_SCOPE_VIOLATION:$($ciFiles -join ',')"
          }

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify immutable evidence filesystem and HEAD blobs
        shell: pwsh
        run: |
          $env:P24B_REPO_EVIDENCE_DIR = 'artifacts/p24b-character-agent'
          $env:P24B_EVIDENCE_GIT_SOURCE = 'HEAD'
          pnpm test:ai:p24b:evidence

      - name: Run P2.4A non-browser regression gates
        shell: pwsh
        run: |
          $p24a = Join-Path $env:RUNNER_TEMP 'p24a'
          $p24aRegressions = Join-Path $env:RUNNER_TEMP 'p24a-regressions'
          New-Item -ItemType Directory -Force -Path $p24a, $p24aRegressions | Out-Null
          $env:P24A_EVIDENCE_DIR = $p24a
          pnpm test:ai:p24a:all
          $env:P24A_EVIDENCE_DIR = $p24aRegressions
          pnpm test:ai:p24a:rc2-regressions
          $env:P24A_CAPABILITY_EVIDENCE = Join-Path $env:RUNNER_TEMP 'p24a-capability-truth.json'
          pnpm test:ai:p24a:rc2-capability
          $all = Get-Content -Raw (Join-Path $p24a 'regression-summary.json') | ConvertFrom-Json
          $required = Get-Content -Raw (Join-Path $p24aRegressions 'required-regressions.json') | ConvertFrom-Json
          $capability = Get-Content -Raw $env:P24A_CAPABILITY_EVIDENCE | ConvertFrom-Json
          $subtotal = $all.pass + $required.totalPass + $capability.pass
          $fail = $all.fail + $required.totalFail + $capability.fail
          $skip = $all.skip + $required.totalSkip + $capability.skip
          if ($subtotal -ne 455 -or $fail -ne 0 -or $skip -ne 0) {
            throw "P24A_NON_BROWSER_EXACT_COUNT_MISMATCH:$subtotal/$fail/$skip"
          }

      - name: Run P2.4B formal matrix
        shell: pwsh
        run: |
          $env:P24B_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-all'
          pnpm test:ai:p24b:all

      - name: Run P2.4B knowledge, relationship, simulation, and approval gates
        shell: pwsh
        run: |
          $env:P24B_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-categories'
          pnpm test:ai:p24b:knowledge
          pnpm test:ai:p24b:relationship
          pnpm test:ai:p24b:simulation
          pnpm test:ai:p24b:proposal

      - name: Run P2.4B security, migration, and backup contracts
        shell: pwsh
        run: |
          $env:P24B_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-boundaries'
          pnpm test:ai:p24b:security
          pnpm test:ai:p24b:migration
          $backup = Get-Content -Raw 'artifacts/p24b-character-agent/backup-restore-results.json' | ConvertFrom-Json
          if ($backup.status -ne 'PASS' -or $backup.semanticHashMatch -ne $true) {
            throw "P24B_BACKUP_RESTORE_CONTRACT_FAILED"
          }

      - name: Run TypeScript
        shell: pwsh
        run: pnpm exec tsc --noEmit

      - name: Run ESLint
        shell: pwsh
        run: pnpm lint

      - name: Scan tracked and candidate text for credentials
        shell: pwsh
        run: |
          $env:P24B_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-secret-scan'
          pnpm test:ai:p24b:secret-scan

      - name: Build production application
        shell: pwsh
        run: pnpm build

      - name: Install Playwright Chromium
        shell: pwsh
        run: pnpm exec playwright install chromium

      - name: Run P2.4A exact browser and P2.4B full Browser Gate
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'next-start.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'next-start.stderr.log'
          $server = Start-Process `
            -FilePath node `
            -ArgumentList @('node_modules/next/dist/bin/next', 'start', '-p', '3125') `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt += 1) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3125/studio/create' -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Get-Content -ErrorAction SilentlyContinue $stdout
              Get-Content -ErrorAction SilentlyContinue $stderr
              throw 'NEXT_SERVER_NOT_READY'
            }
            $env:P24A_BASE_URL = 'http://127.0.0.1:3125'
            $env:P24A_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24a-browser'
            pnpm test:ai:p24a:rc2-browser
            $env:P24B_BASE_URL = 'http://127.0.0.1:3125'
            $env:P24B_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-browser'
            pnpm test:ai:p24b:browser
            $p24aBrowser = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'p24a-browser/browser-full-flow.json') | ConvertFrom-Json
            $p24bBrowser = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'p24b-browser/browser-full-flow.json') | ConvertFrom-Json
            if ($p24aBrowser.pass -ne 61 -or $p24aBrowser.fail -ne 0 -or $p24aBrowser.skip -ne 0) {
              throw "P24A_BROWSER_EXACT_COUNT_MISMATCH:$($p24aBrowser.pass)/$($p24aBrowser.fail)/$($p24aBrowser.skip)"
            }
            if ($p24bBrowser.pass -ne 61 -or $p24bBrowser.fail -ne 0 -or $p24bBrowser.skip -ne 0 -or $p24bBrowser.flowSteps.Count -ne 30) {
              throw "P24B_BROWSER_EXACT_COUNT_MISMATCH:$($p24bBrowser.pass)/$($p24bBrowser.fail)/$($p24bBrowser.skip)/$($p24bBrowser.flowSteps.Count)"
            }
            if (455 + $p24aBrowser.pass -ne 516) {
              throw 'P24A_EXACT_TOTAL_MISMATCH'
            }
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }
