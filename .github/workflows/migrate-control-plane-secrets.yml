name: Migrate control-plane secrets

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Secret scope to migrate without exposing values
        required: true
        type: choice
        options:
          - repository
          - trusted-preview

permissions:
  contents: read

concurrency:
  group: novel-repository-control-plane-secret-migration
  cancel-in-progress: false

jobs:
  repository:
    name: migrate repository control-plane secrets
    if: >-
      github.repository == 'bobobo-org/novel' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_sha == github.sha &&
      inputs.scope == 'repository'
    environment: trusted-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}
      DESTINATION_REPOSITORY: brendonlee1006/novel
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY: ${{ secrets.PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY }}
      PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY: ${{ secrets.PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY }}
    steps:
      - name: Copy approved repository secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$GH_TOKEN"
          expected=(
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
            PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY
            PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY
          )
          for name in "${expected[@]}"; do
            value="${!name-}"
            if [[ -z "$value" ]]; then
              printf 'MIGRATION_SOURCE_SECRET_MISSING:%s\n' "$name" >&2
              exit 1
            fi
            printf '%s' "$value" | gh secret set "$name" --repo "$DESTINATION_REPOSITORY"
            unset value
          done
          names="$(gh secret list --repo "$DESTINATION_REPOSITORY" --json name --jq '.[].name')"
          for name in "${expected[@]}"; do
            grep -Fxq "$name" <<<"$names" || {
              printf 'MIGRATION_DESTINATION_SECRET_MISSING:%s\n' "$name" >&2
              exit 1
            }
          done
          echo 'MIGRATION_REPOSITORY_SECRETS_COMPLETE'

  trusted_preview:
    name: migrate trusted Preview secrets
    if: >-
      github.repository == 'bobobo-org/novel' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_sha == github.sha &&
      inputs.scope == 'trusted-preview'
    environment: trusted-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}
      DESTINATION_REPOSITORY: brendonlee1006/novel
      DESTINATION_ENVIRONMENT: trusted-preview
      PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_ED25519_PUBLIC_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_ED25519_PUBLIC_KEY }}
      PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_KEY_ID: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_KEY_ID }}
      PREVIEW_PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY }}
      PREVIEW_PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY }}
      PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
      PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
      PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
    steps:
      - name: Copy approved Preview secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$GH_TOKEN"
          expected=(
            PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_ED25519_PUBLIC_KEY
            PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_KEY_ID
            PREVIEW_PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY
            PREVIEW_PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY
            PREVIEW_SUPABASE_ANON_KEY
            PREVIEW_SUPABASE_SERVICE_ROLE_KEY
            PREVIEW_SUPABASE_URL
          )
          for name in "${expected[@]}"; do
            value="${!name-}"
            if [[ -z "$value" ]]; then
              printf 'MIGRATION_SOURCE_PREVIEW_SECRET_MISSING:%s\n' "$name" >&2
              exit 1
            fi
            printf '%s' "$value" | gh secret set "$name" --env "$DESTINATION_ENVIRONMENT" --repo "$DESTINATION_REPOSITORY"
            unset value
          done
          names="$(gh secret list --env "$DESTINATION_ENVIRONMENT" --repo "$DESTINATION_REPOSITORY" --json name --jq '.[].name')"
          for name in "${expected[@]}"; do
            grep -Fxq "$name" <<<"$names" || {
              printf 'MIGRATION_DESTINATION_PREVIEW_SECRET_MISSING:%s\n' "$name" >&2
              exit 1
            }
          done
          echo 'MIGRATION_TRUSTED_PREVIEW_SECRETS_COMPLETE'
