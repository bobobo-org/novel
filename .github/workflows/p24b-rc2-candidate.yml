name: P2.4B RC2 Unified Professional UI Candidate

on:
  pull_request:
    branches:
      - release/p24a-rc2-approved-product
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p24b-rc2-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  P24A_APPROVED_BASELINE: d74b97d026589f202cc6645a07770c30b586ebb9
  P24B_RC1_PRODUCT: 71bea12da90def7646efe1189f059896d3582327
  P24B_RC2_PRODUCT_COMMIT: b21db7fc97cbf11109876aea409b8fc6e8177c3b
  P24B_RC2_EVIDENCE_COMMIT: 20432b10544ce69fa73fb9c84f1b85076fcfcb6d
  P24B_RC2_R1_CI_HEAD: d10da438607e53ccc6838cd2a4602bc3e5ecd7b3
  P24B_RC2_RELEASE_TAG: novel-ai-p24b-character-agent-rc2

jobs:
  verify:
    name: Windows LF, identity, unified UI, regression, browser, and evidence gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Configure canonical LF before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and four-commit chain
        shell: pwsh
        run: |
          $expectedHead = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actualHead = git rev-parse HEAD
          if ($actualHead -ne $expectedHead) {
            throw "EXACT_CHECKOUT_MISMATCH:$actualHead/$expectedHead"
          }
          if ((git config --get core.autocrlf) -ne 'false') {
            throw 'CORE_AUTOCRLF_NOT_FALSE'
          }
          if ((git config --get core.eol) -ne 'lf') {
            throw 'CORE_EOL_NOT_LF'
          }
          if (@(git status --porcelain=v1).Count) {
            throw 'CHECKOUT_NOT_CLEAN'
          }
          if ((git rev-parse "$env:P24B_RC2_PRODUCT_COMMIT^") -ne $env:P24B_RC1_PRODUCT) {
            throw 'PRODUCT_PARENT_MISMATCH'
          }
          if ((git rev-parse "$env:P24B_RC2_EVIDENCE_COMMIT^") -ne $env:P24B_RC2_PRODUCT_COMMIT) {
            throw 'EVIDENCE_PARENT_MISMATCH'
          }
          if ((git rev-parse "$env:P24B_RC2_R1_CI_HEAD^") -ne $env:P24B_RC2_EVIDENCE_COMMIT) {
            throw 'R1_CI_PARENT_MISMATCH'
          }
          if ((git rev-parse 'HEAD^') -ne $env:P24B_RC2_R1_CI_HEAD) {
            throw 'TEST_HARNESS_PARENT_MISMATCH'
          }
          $remoteBase = (git ls-remote origin refs/heads/release/p24a-rc2-approved-product).Split()[0]
          if ($remoteBase -ne $env:P24A_APPROVED_BASELINE) {
            throw "REMOTE_BASELINE_MISMATCH:$remoteBase"
          }
          if ((git log -1 --format=%s $env:P24B_RC2_PRODUCT_COMMIT) -ne 'feat(release): unify P2.4B professional workspace RC2') {
            throw 'PRODUCT_MESSAGE_MISMATCH'
          }
          if ((git log -1 --format=%s $env:P24B_RC2_EVIDENCE_COMMIT) -ne 'test(release): seal P2.4B RC2 unified UI evidence') {
            throw 'EVIDENCE_MESSAGE_MISMATCH'
          }
          if ((git log -1 --format=%s $env:P24B_RC2_R1_CI_HEAD) -ne 'ci: verify P2.4B RC2 unified professional UI') {
            throw 'R1_CI_MESSAGE_MISMATCH'
          }
          if ((git log -1 --format=%s HEAD) -ne 'test: honor product-owned reload in P2.4A restore gate') {
            throw 'TEST_HARNESS_MESSAGE_MISMATCH'
          }

          $evidenceFiles = @(git diff --name-only $env:P24B_RC2_PRODUCT_COMMIT $env:P24B_RC2_EVIDENCE_COMMIT)
          $invalidEvidence = @($evidenceFiles | Where-Object {
            $_ -notlike 'artifacts/p24b-rc2-unified-ui/*'
          })
          if ($evidenceFiles.Count -ne 26 -or $invalidEvidence.Count) {
            throw "EVIDENCE_SCOPE_VIOLATION:$($invalidEvidence -join ',')"
          }

          $ciFiles = @(git diff --name-only $env:P24B_RC2_EVIDENCE_COMMIT $env:P24B_RC2_R1_CI_HEAD)
          if ($ciFiles.Count -ne 1 -or $ciFiles[0] -ne '.github/workflows/p24b-rc2-candidate.yml') {
            throw "CI_SCOPE_VIOLATION:$($ciFiles -join ',')"
          }

          $testHarnessFiles = @(git diff --name-only $env:P24B_RC2_R1_CI_HEAD HEAD)
          $expectedTestHarnessFiles = @(
            '.github/workflows/p24b-rc2-candidate.yml'
            'scripts/run-p24a-rc2-browser-gate.mjs'
          )
          $testHarnessScopeDiff = @(Compare-Object -ReferenceObject $expectedTestHarnessFiles -DifferenceObject $testHarnessFiles)
          if ($testHarnessFiles.Count -ne 2 -or $testHarnessScopeDiff.Count) {
            throw "TEST_HARNESS_SCOPE_VIOLATION:$($testHarnessFiles -join ',')"
          }

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify Product scope and selective reference port
        shell: pwsh
        run: |
          $env:P24B_RC2_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-rc2-scope'
          pnpm test:ai:p24b:rc2-product-scope
          $scope = Get-Content -Raw -Encoding utf8 (Join-Path $env:P24B_RC2_EVIDENCE_DIR 'selective-port-map.json') | ConvertFrom-Json
          if ($scope.productCommit -ne $env:P24B_RC2_PRODUCT_COMMIT -or $scope.unexpected -ne 0) {
            throw 'PRODUCT_SCOPE_FAILED'
          }

      - name: Verify RC2 release identity and frontdoor contracts
        shell: pwsh
        run: |
          $env:P24B_RC2_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-rc2-identity'
          pnpm test:ai:p24b:rc2-release
          pnpm test:ai:p11:consumer
          pnpm test:ai:p11r2:frontdoor-truth

      - name: Verify official Action owners and immutable workflow pins
        shell: pwsh
        run: |
          $env:P24B_RC2_WORKFLOW_PATH = '.github/workflows/p24b-rc2-candidate.yml'
          $env:P24B_RC2_ACTION_PIN_REPORT = Join-Path $env:RUNNER_TEMP 'p24b-rc2-action-pins.json'
          pnpm test:ai:p24b:rc2-action-pins

      - name: Verify sealed Evidence filesystem and Git blobs
        shell: pwsh
        run: |
          $env:P24B_RC2_EVIDENCE_DIR = 'artifacts/p24b-rc2-unified-ui'
          $env:P24B_RC2_EVIDENCE_GIT_SOURCE = 'HEAD'
          pnpm test:ai:p24b:rc2-evidence

      - name: Verify sealed local model evidence
        shell: pwsh
        run: |
          node -e 'const a=require("node:assert/strict");const fs=require("node:fs");const v=JSON.parse(fs.readFileSync("artifacts/p24b-rc2-unified-ui/ollama-real-smoke.json","utf8"));a.equal(v.productCommit,process.env.P24B_RC2_PRODUCT_COMMIT);a.equal(v.status,"P2.4B_REAL_OLLAMA_SMOKE_PASS");a.deepEqual([v.pass,v.fail,v.skip],[8,0,0]);a.equal(v.model.id,"qwen2.5:3b");a.match(v.model.digest,/^[0-9a-f]{64}$/);a.equal(v.externalRequests,0);a.equal(v.dataLeftDevice,false);a.equal(v.rawChainOfThoughtStored,false);console.log(JSON.stringify({status:"PASS",pass:v.pass,model:v.model.id}))'

      - name: Generate Product-sealed provenance for TypeScript
        shell: pwsh
        run: |
          $env:NOVEL_BUILD_APP_COMMIT = $env:P24B_RC2_PRODUCT_COMMIT
          $env:NOVEL_BUILD_SEALED_AT = git show -s --format=%cI $env:P24B_RC2_PRODUCT_COMMIT

          node scripts/generate-release-provenance.mjs

          $path = 'generated/release-provenance.json'
          if (-not (Test-Path $path)) {
            throw 'TYPECHECK_PROVENANCE_NOT_GENERATED'
          }

          $provenance = Get-Content -Raw -Encoding utf8 $path | ConvertFrom-Json

          if ($provenance.appCommit -ne $env:P24B_RC2_PRODUCT_COMMIT) {
            throw "TYPECHECK_PROVENANCE_PRODUCT_MISMATCH:$($provenance.appCommit)"
          }

          if ($provenance.releaseTag -ne $env:P24B_RC2_RELEASE_TAG) {
            throw "TYPECHECK_PROVENANCE_TAG_MISMATCH:$($provenance.releaseTag)"
          }

          if ($provenance.architectureStage -ne 'P2.4B RC') {
            throw "TYPECHECK_PROVENANCE_STAGE_MISMATCH:$($provenance.architectureStage)"
          }

          if ($provenance.source -ne 'explicit_build_commit') {
            throw "TYPECHECK_PROVENANCE_SOURCE_MISMATCH:$($provenance.source)"
          }

          if ($provenance.integrity.algorithm -ne 'sha256') {
            throw 'TYPECHECK_PROVENANCE_ALGORITHM_MISMATCH'
          }

          if ($provenance.integrity.payloadHash -notmatch '^[0-9a-f]{64}$') {
            throw 'TYPECHECK_PROVENANCE_HASH_INVALID'
          }

      - name: Run TypeScript
        shell: pwsh
        run: pnpm exec tsc --noEmit

      - name: Run ESLint with zero errors
        shell: pwsh
        run: pnpm lint

      - name: Scan candidate text for credentials
        shell: pwsh
        run: |
          $env:P24B_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-rc2-secret'
          pnpm test:ai:p24b:secret-scan

      - name: Run P2.4A exact non-browser gates
        shell: pwsh
        run: |
          $core = Join-Path $env:RUNNER_TEMP 'p24a-core'
          $regressions = Join-Path $env:RUNNER_TEMP 'p24a-regressions'
          New-Item -ItemType Directory -Force -Path $core, $regressions | Out-Null
          $env:P24A_EVIDENCE_DIR = $core
          pnpm test:ai:p24a:all
          $env:P24A_EVIDENCE_DIR = $regressions
          pnpm test:ai:p24a:rc2-regressions
          $env:P24A_CAPABILITY_EVIDENCE = Join-Path $env:RUNNER_TEMP 'p24a-capability-truth.json'
          pnpm test:ai:p24a:rc2-capability

          $all = Get-Content -Raw -Encoding utf8 (Join-Path $core 'regression-summary.json') | ConvertFrom-Json
          $required = Get-Content -Raw -Encoding utf8 (Join-Path $regressions 'required-regressions.json') | ConvertFrom-Json
          $capability = Get-Content -Raw -Encoding utf8 $env:P24A_CAPABILITY_EVIDENCE | ConvertFrom-Json
          $pass = $all.pass + $required.totalPass + $capability.pass
          $fail = $all.fail + $required.totalFail + $capability.fail
          $skip = $all.skip + $required.totalSkip + $capability.skip
          if ($pass -ne 455 -or $fail -ne 0 -or $skip -ne 0) {
            throw "P24A_NON_BROWSER_COUNT_MISMATCH:$pass/$fail/$skip"
          }

      - name: Run P2.4B formal matrix
        shell: pwsh
        run: |
          $env:P24B_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-formal'
          pnpm test:ai:p24b:all
          $formal = Get-Content -Raw -Encoding utf8 (Join-Path $env:P24B_EVIDENCE_DIR 'p24b-regression-summary.json') | ConvertFrom-Json
          if ($formal.pass -ne 372 -or $formal.fail -ne 0 -or $formal.skip -ne 0) {
            throw "P24B_FORMAL_COUNT_MISMATCH:$($formal.pass)/$($formal.fail)/$($formal.skip)"
          }

      - name: Remove known regression runner side effects
        shell: pwsh
        run: |
          git restore --source=HEAD -- `
            artifacts/p21-three-high/tests/indexeddb-transaction.json `
            artifacts/p21-three-high/tests/latest.json `
            artifacts/p21-three-high/tests/pre-parse-report.json `
            artifacts/p21-three-high/tests/pre-parse-report.sha256
          git clean -f -- `
            artifacts/p22/core-test-results.json `
            artifacts/p22/core-test-results.sha256 `
            artifacts/p23/sovereign-foundation-tests.json `
            artifacts/p23/sovereign-foundation-tests.sha256 `
            artifacts/p23-rc2-security/capability-truth-matrix.json `
            artifacts/p23-rc2-security/evaluator-disagreement-matrix.json `
            artifacts/p23-rc2-security/knowledge-poisoning-matrix.json `
            artifacts/p23-rc2-security/model-supply-chain-matrix.json `
            artifacts/p23-rc2-security/parser-sandbox-matrix.json `
            artifacts/p23-rc2-security/prompt-injection-matrix.json `
            artifacts/p23-rc2-security/security-test-results.json `
            artifacts/p23-rc2-security/taint-propagation-matrix.json `
            artifacts/p23-rc2-security/test-source-hash.json `
            public/legacy/novel-system.build.json
          if (@(git status --porcelain=v1).Count) {
            throw 'UNEXPECTED_REGRESSION_SIDE_EFFECT'
          }

      - name: Verify two-build reproducibility
        shell: pwsh
        run: |
          $env:P24B_RC2_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-rc2-reproducibility'
          pnpm test:ai:p24b:rc2-build-reproducibility
          $report = Get-Content -Raw -Encoding utf8 (Join-Path $env:P24B_RC2_EVIDENCE_DIR 'build-reproducibility.json') | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or $report.missing.Count -or $report.unexpected.Count -or $report.mismatch.Count) {
            throw 'BUILD_REPRODUCIBILITY_FAILED'
          }

      - name: Build application and verify Product-sealed provenance
        shell: pwsh
        run: |
          $env:NOVEL_BUILD_APP_COMMIT = $env:P24B_RC2_PRODUCT_COMMIT
          $env:NOVEL_BUILD_SEALED_AT = git show -s --format=%cI $env:P24B_RC2_PRODUCT_COMMIT
          $env:NOVEL_STATIC_STAMP = '1'
          pnpm build
          $env:P24B_RC2_CI_HEAD = git rev-parse HEAD
          $env:P24B_RC2_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-rc2-build-provenance'
          pnpm test:ai:p24b:rc2-build-provenance

      - name: Install Playwright Chromium
        shell: pwsh
        run: pnpm exec playwright install chromium

      - name: Run unified UI, exact browser, health, and dynamic asset gates
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'next-start.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'next-start.stderr.log'
          $server = Start-Process `
            -FilePath node `
            -ArgumentList @('node_modules/next/dist/bin/next', 'start', '-p', '3125') `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt += 1) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3125/api/ai/health' -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Get-Content -ErrorAction SilentlyContinue $stdout
              Get-Content -ErrorAction SilentlyContinue $stderr
              throw 'NEXT_SERVER_NOT_READY'
            }

            for ($sample = 0; $sample -lt 3; $sample += 1) {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:3125/api/ai/health' -TimeoutSec 10
              if ($health.appCommit -ne $env:P24B_RC2_PRODUCT_COMMIT) {
                throw "HEALTH_COMMIT_MISMATCH:$($health.appCommit)"
              }
              if ($health.releaseTag -ne $env:P24B_RC2_RELEASE_TAG) {
                throw "HEALTH_TAG_MISMATCH:$($health.releaseTag)"
              }
              if ($health.architectureStage -ne 'P2.4B RC' -or $health.commitProvenanceStatus -ne 'verified') {
                throw 'HEALTH_IDENTITY_MISMATCH'
              }
            }

            $env:P24B_RC2_UI_BASE_URL = 'http://127.0.0.1:3125'
            $env:P24B_RC2_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-rc2-ui'
            pnpm test:ai:p24b:rc2-ui

            $env:P24A_BASE_URL = 'http://127.0.0.1:3125'
            $env:P24A_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24a-browser'
            pnpm test:ai:p24a:rc2-browser

            $env:P24B_BASE_URL = 'http://127.0.0.1:3125'
            $env:P24B_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'p24b-browser'
            pnpm test:ai:p24b:browser

            $env:P23_RC3_BASE_URL = 'http://127.0.0.1:3125'
            $env:P23_RC3_ASSET_PAGE = '/legacy/novel-system.html?screen=home'
            $env:P23_RC3_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP 'p24b-dynamic-assets'
            pnpm test:ai:p23:dynamic-assets

            node -e 'const a=require("node:assert/strict");const fs=require("node:fs");const t=process.env.RUNNER_TEMP.replaceAll("\\","/");const ui=JSON.parse(fs.readFileSync(t+"/p24b-rc2-ui/frontdoor-routes.json","utf8"));const p24a=JSON.parse(fs.readFileSync(t+"/p24a-browser/browser-full-flow.json","utf8"));const p24b=JSON.parse(fs.readFileSync(t+"/p24b-browser/browser-full-flow.json","utf8"));const dynamic=JSON.parse(fs.readFileSync(t+"/p24b-dynamic-assets/dynamic-asset-results.json","utf8"));const restoreNavigation=p24a.navigationOwnership?.restore;const restoreIntegrity=p24a.restoreIntegrity;const diagnostics=p24a.diagnostics;const serializedP24a=JSON.stringify(p24a);a.deepEqual([ui.pass,ui.fail,ui.skip],[154,0,0]);a.deepEqual([p24a.pass,p24a.fail,p24a.skip],[61,0,0]);a.equal(restoreNavigation?.owner,"PRODUCT");a.equal(restoreNavigation?.productReloadObserved,true);a.equal(restoreNavigation?.productReloadType,"reload");a.equal(restoreNavigation?.mainFrameNavigationCount,1);a.equal(restoreNavigation?.harnessReloadIssued,false);a.equal(restoreNavigation?.harnessGotoIssued,false);a.equal(restoreNavigation?.normalFlowRace,0);a.equal(restoreNavigation?.errAborted,0);a.equal(restoreNavigation?.frameDetached,0);a.equal(restoreNavigation?.executionContextDestroyed,0);a.equal(restoreIntegrity?.characterRestored,true);a.equal(restoreIntegrity?.worldRuleRestored,true);a.equal(restoreIntegrity?.storyBibleRestored,true);a.equal(restoreIntegrity?.projectRestored,true);a.equal(restoreIntegrity?.backupSemanticHashMatch,true);a.equal(restoreIntegrity?.canonicalCorruption,0);a.equal(restoreIntegrity?.duplicateRestore,0);a.equal(restoreIntegrity?.duplicateBackup,0);a.equal(diagnostics?.consoleErrorCount,0);a.equal(diagnostics?.pageErrorCount,0);a.equal(diagnostics?.requestFailureCount,0);a.equal(diagnostics?.externalRequestCount,0);a.equal(diagnostics?.unexpectedHttpErrorCount,0);a.doesNotMatch(serializedP24a,/ERR_ABORTED|frame detached|execution context destroyed/i);a.deepEqual([p24b.pass,p24b.fail,p24b.skip],[61,0,0]);a.equal(p24b.flowSteps.length,30);a.equal(dynamic.status,"PASS");a.equal(dynamic.totalCanonicalLocalAssets,dynamic.passedCanonicalLocalAssets);console.log(JSON.stringify({status:"PASS",ui:ui.pass,p24a:p24a.pass,p24b:p24b.pass,flowSteps:p24b.flowSteps.length,dynamic:dynamic.totalCanonicalLocalAssets}))'
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }
