name: Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
  TARGET_ALIAS: novel-orcin.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deployment tooling
        run: npm install --global pnpm@10 vercel@56.3.2

      - name: Pull Vercel environment (production)
        if: github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Pull Vercel environment (preview)
        if: github.ref != 'refs/heads/main'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Build (preview)
        if: github.ref != 'refs/heads/main'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy staged production
        if: github.ref == 'refs/heads/main'
        id: production
        shell: bash
        run: |
          set -euo pipefail
          output="$(vercel deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+' <<<"$output" | tail -n 1)"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staged production
        if: github.ref == 'refs/heads/main'
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          health_url="${{ steps.production.outputs.url }}/api/ai/health?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in {1..30}; do
            if body="$(curl --fail --silent --show-error "$health_url" 2>/dev/null)"; then
              app_commit="$(jq -r '.appCommit // empty' <<<"$body")"
              deployment_id="$(jq -r '.deploymentId // empty' <<<"$body")"
              if [[ "$app_commit" == "$GITHUB_SHA" && -n "$deployment_id" ]]; then
                echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Staged deployment health did not match commit $GITHUB_SHA." >&2
          exit 1

      - name: Update requested production alias
        if: github.ref == 'refs/heads/main'
        run: >-
          vercel alias set
          "${{ steps.production.outputs.url }}"
          "$TARGET_ALIAS"
          --scope=lqtechs-projects
          --token="$VERCEL_TOKEN"

      - name: Verify production alias
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          target_url="https://${TARGET_ALIAS}/api/ai/health?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target_ok=false
          for attempt in {1..30}; do
            if body="$(curl --fail --silent --show-error "$target_url" 2>/dev/null)"; then
              app_commit="$(jq -r '.appCommit // empty' <<<"$body")"
              deployment_id="$(jq -r '.deploymentId // empty' <<<"$body")"
              if [[ "$app_commit" == "$GITHUB_SHA" && "$deployment_id" == "${{ steps.staged.outputs.deployment_id }}" ]]; then
                target_ok=true
                break
              fi
            fi
            sleep 2
          done
          if [[ "$target_ok" != "true" ]]; then
            echo "Target alias did not resolve to the staged deployment." >&2
            exit 1
          fi

      - name: Deploy (preview)
        if: github.ref != 'refs/heads/main'
        run: vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN"
