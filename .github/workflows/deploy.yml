name: Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Recovery operation
        required: true
        type: choice
        options:
          - restore-known-stable

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
  PRIMARY_ALIAS: novel-orcin.vercel.app
  MIRROR_ALIAS: novel-lqtechs-projects.vercel.app
  VERCEL_SCOPE: lqtechs-projects
  LEGACY_BOOTSTRAP_DEPLOYMENT_ID: dpl_8vdPA2mFkDJUezr5Rfn5MuxqJuBa
  LEGACY_BOOTSTRAP_COMMIT: d0e80323dc68bf08cb541e46c6b9114a71e05cd9
  RECOVERY_DEPLOYMENT_ID: dpl_ECbrLCX4RsdhUUjYj7cZrhY27oJV
  RECOVERY_COMMIT: 5cf5e819a95d9f98d485a2bec1c39ae68c1d4a1f

jobs:
  validate:
    name: validate
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run required product suites
        run: |
          set -euo pipefail
          pnpm test:ai:p24b:all
          pnpm test:ai:p24b-rc3-1-regeneration
          pnpm test:ai:closed:unified-os
          pnpm test:ai:closed:web-operability
          pnpm test:ai:closed:optimization
          pnpm test:ai:closed:cloud-sync
          pnpm test:ai:closed:model-verification-timeout
          pnpm test:ai:closed:super-agent-rpg
          pnpm test:ai:closed:cache-runtime
          pnpm test:ai:closed:controlled-learning-runtime
          pnpm test:ai:closed-ai-runtime-r2
          pnpm test:p12
          pnpm test:studio:chapter-isolation
          pnpm test:ai:p15:consumer-platform
          pnpm test:ai:p21:three-high

      - name: Run PR23 R2.1 truth gates
        run: |
          set -euo pipefail
          pnpm test:ai:indexeddb-blocked-byte-preservation
          pnpm test:ai:indexeddb-blocked-ui-write-gate
          pnpm test:ai:daily-backup-marker-after-success
          pnpm test:ai:quick-assistant-canonical-approval
          pnpm test:ai:actual-executor-truth
          pnpm test:ai:legacy-health-cannot-claim-closed-runtime
          pnpm test:ci:dual-alias-rollback
          pnpm test:ci:workflow-contract

      - name: Verify secrets, Companion ZIP, and evidence schemas
        run: |
          set -euo pipefail
          pnpm test:ai:p24b:secret-scan
          pnpm test:ci:companion-zip-content
          pnpm test:ci:evidence-schema
          pnpm test:ci:production-supabase-bootstrap

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  preview:
    name: preview
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout trusted PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Preview deployment tooling
        run: npm install --global pnpm@10 vercel@56.3.2

      - name: Pull Vercel environment (Preview)
        run: vercel pull --yes --environment=preview --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build Preview
        run: vercel build --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy isolated Preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          output="$(vercel deploy --prebuilt --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" 2>&1)"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+' <<<"$output" | tail -n 1)"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "::notice title=RC3 Preview URL::$deployment_url"

      - name: Verify Preview release identity
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          identity_url="$PREVIEW_URL/api/release/identity?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in {1..30}; do
            if body="$(curl --fail --silent --show-error "$identity_url" 2>/dev/null)"; then
              app_commit="$(jq -r '.appCommit // empty' <<<"$body")"
              environment="$(jq -r '.environment // empty' <<<"$body")"
              provenance_status="$(jq -r '.provenanceStatus // empty' <<<"$body")"
              release_tag="$(jq -r '.releaseTag // empty' <<<"$body")"
              if [[ "$app_commit" == "$EXPECTED_COMMIT" && "$environment" == "preview" && "$provenance_status" == "verified" && "$release_tag" == "novel-ai-p24b-runtime-consumer-activation-rc3" ]]; then
                printf '### RC3 Preview\n\n- URL: %s\n- Commit: `%s`\n- Release identity: verified\n' "$PREVIEW_URL" "$EXPECTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Preview release identity did not match trusted PR head $EXPECTED_COMMIT." >&2
          exit 1

  production_env_bootstrap:
    name: production env bootstrap
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_FALLBACK: ijjicaiiirkfbewbhepx
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Vercel environment tooling
        run: npm install --global vercel@56.3.2

      - name: Verify and recover Production Supabase environment
        run: node scripts/bootstrap-production-supabase-env.mjs

  restore_known_stable:
    name: restore known stable production aliases
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restore-known-stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Restore and verify both production aliases
        env:
          PRIMARY_BEFORE_DEPLOYMENT: ${{ env.RECOVERY_DEPLOYMENT_ID }}
          PRIMARY_BEFORE_COMMIT: ${{ env.RECOVERY_COMMIT }}
          MIRROR_BEFORE_DEPLOYMENT: ${{ env.RECOVERY_DEPLOYMENT_ID }}
          MIRROR_BEFORE_COMMIT: ${{ env.RECOVERY_COMMIT }}
        run: node scripts/vercel-dual-alias-cutover.mjs restore

  deploy:
    name: deploy
    needs: [validate, production_env_bootstrap]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install deployment tooling
        run: npm install --global pnpm@10 vercel@56.3.2

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture both current alias identities for rollback
        if: github.ref == 'refs/heads/main'
        id: aliases_before
        run: node scripts/vercel-dual-alias-cutover.mjs capture

      - name: Pull Vercel environment (production)
        if: github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Provision and verify encrypted cloud sync private storage
        if: github.ref == 'refs/heads/main'
        run: node scripts/provision-cloud-sync-storage.mjs --env-file .vercel/.env.production.local --required

      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy staged production
        if: github.ref == 'refs/heads/main'
        id: production
        shell: bash
        run: |
          set -euo pipefail
          output="$(vercel deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN" 2>&1)"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+' <<<"$output" | tail -n 1)"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staged production identity
        if: github.ref == 'refs/heads/main'
        id: staged
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          identity_url="${{ steps.production.outputs.url }}/api/release/identity?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in {1..30}; do
            if body="$(curl --fail --silent --show-error "$identity_url" 2>/dev/null)"; then
              app_commit="$(jq -r '.appCommit // empty' <<<"$body")"
              deployment_id="$(jq -r '.deploymentId // empty' <<<"$body")"
              provenance_status="$(jq -r '.provenanceStatus // empty' <<<"$body")"
              environment="$(jq -r '.environment // empty' <<<"$body")"
              if [[ "$app_commit" == "$GITHUB_SHA" && -n "$deployment_id" && "$provenance_status" == "verified" && "$environment" == "production" ]]; then
                echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Staged release identity did not match commit $GITHUB_SHA." >&2
          exit 1

      - name: Verify staged encrypted cloud sync runtime
        if: steps.staged.outcome == 'success'
        id: staged_health
        continue-on-error: true
        shell: bash
        env:
          STAGED_URL: ${{ steps.production.outputs.url }}
        run: |
          set -euo pipefail
          health_url="$STAGED_URL/api/persistence/sync/health?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in {1..30}; do
            if body="$(curl --fail --silent --show-error "$health_url" 2>/dev/null)"; then
              status="$(jq -r '.status // empty' <<<"$body")"
              migration="$(jq -r '.migrationVersion // empty' <<<"$body")"
              schema="$(jq -r '.schemaVersion // empty' <<<"$body")"
              backend="$(jq -r '.storageBackend // empty' <<<"$body")"
              if [[ "$status" == "ready" && "$migration" == "cloud_sync_e2ee_storage_001" && "$schema" == "novel-cloud-sync-e2ee-v1" && "$backend" == "private-object-storage" ]]; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Staged encrypted cloud sync runtime is not ready; aliases remain unchanged." >&2
          exit 1

      - name: Restore aliases after staged gate rejection
        if: always() && steps.production.outcome == 'success' && (steps.staged.outcome != 'success' || steps.staged_health.outcome != 'success')
        env:
          PRIMARY_BEFORE_DEPLOYMENT: ${{ steps.aliases_before.outputs.primary_deployment_id }}
          PRIMARY_BEFORE_COMMIT: ${{ steps.aliases_before.outputs.primary_app_commit }}
          MIRROR_BEFORE_DEPLOYMENT: ${{ steps.aliases_before.outputs.mirror_deployment_id }}
          MIRROR_BEFORE_COMMIT: ${{ steps.aliases_before.outputs.mirror_app_commit }}
        run: node scripts/vercel-dual-alias-cutover.mjs restore

      - name: Cut over both aliases with atomic compensation
        if: steps.staged.outcome == 'success' && steps.staged_health.outcome == 'success'
        env:
          STAGED_TARGET: ${{ steps.production.outputs.url }}
          STAGED_DEPLOYMENT_ID: ${{ steps.staged.outputs.deployment_id }}
          EXPECTED_COMMIT: ${{ github.sha }}
          PRIMARY_BEFORE_DEPLOYMENT: ${{ steps.aliases_before.outputs.primary_deployment_id }}
          PRIMARY_BEFORE_COMMIT: ${{ steps.aliases_before.outputs.primary_app_commit }}
          MIRROR_BEFORE_DEPLOYMENT: ${{ steps.aliases_before.outputs.mirror_deployment_id }}
          MIRROR_BEFORE_COMMIT: ${{ steps.aliases_before.outputs.mirror_app_commit }}
        run: node scripts/vercel-dual-alias-cutover.mjs

      - name: Fail after compensated staged gate rejection
        if: always() && steps.production.outcome == 'success' && (steps.staged.outcome != 'success' || steps.staged_health.outcome != 'success')
        run: |
          echo "Staged production was rejected and both aliases were restored." >&2
          exit 1
